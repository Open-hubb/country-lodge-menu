    .section-header .count { font-size: 11px; color: #666; margin-top: 2px; }
    .section-header .chevron { width: 18px; height: 18px; color: #999; transition: transform 0.2s; flex-shrink: 0; }
    .section-header .chevron.open { transform: rotate(180deg); }
    .section-body { padding: 0 16px 14px; display: none; }
    .section-body.open { display: block; }
    .sub-title { font-family: 'Cormorant Garamond', serif; font-size: 14px; font-weight: 600; padding: 10px 0 6px; border-bottom: 1px solid #f0ebe0; margin-bottom: 4px; color: #8a7430; }

    /* Menu Item */
    .item { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
    .item:last-child { border-bottom: none; }
    .item-info { flex: 1; padding-right: 10px; }
    .item-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; line-height: 1.3; }
    .item-name .tag { font-size: 11px; }
    .item-desc { font-size: 11px; color: #666; margin-top: 3px; line-height: 1.5; }
    .item-variants { display: flex; gap: 10px; margin-top: 3px; }
    .item-variants span { font-size: 10px; color: #666; }
    .item-price { font-size: 12px; font-weight: 600; margin-top: 4px; }

    /* Add / Qty buttons */
    .add-btn { width: 30px; height: 30px; border-radius: 50%; background: #B8963E; color: #fff; border: none; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .qty-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 2px; }
    .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #e8e0d0; background: #fff; color: #666; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn.plus { background: #B8963E; color: #fff; border: none; }
    .qty-count { font-size: 13px; font-weight: 600; width: 18px; text-align: center; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; max-width: 480px; margin: 0 auto; padding: 8px 12px calc(env(safe-area-inset-bottom, 8px) + 6px); background: rgba(255,255,255,0.97); backdrop-filter: blur(8px); border-top: 1px solid #e8e0d0; display: flex; gap: 8px; align-items: center; }

    .cart-bar-btn { flex: 1; display: flex; align-items: center; justify-content: space-between; background: #B8963E; color: #fff; border: none; border-radius: 14px; padding: 12px 16px; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 20px rgba(184,150,62,0.3); display: none; }

    .cart-bar-btn .badge { background: rgba(255,255,255,0.2); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }

    .cart-bar-btn .total { font-size: 13px; font-weight: 600; }

    .drawer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); z-index: 61; background: #fff; border-radius: 20px 20px 0 0; max-height: 80vh; width: 100%; max-width: 480px; display: flex; flex-direction: column; transition: transform 0.3s ease-out; }
    .drawer.show { transform: translateX(-50%) translateY(0); }

    .pay-btn { width: 100%; background: #B8963E; color: #fff; border: none; border-radius: 14px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 16px rgba(184,150,62,0.25); }

  </style>
</head>

// ── Cart State ──
let cart = JSON.parse(localStorage.getItem('eden-cart') || '{}');

function saveCart() {
  localStorage.setItem('eden-cart', JSON.stringify(cart));
  updateCartUI();
}

function addToCart(id, name, price) {
  if (!cart[id]) cart[id] = { name, price, qty: 0 };
  cart[id].qty++;
  saveCart();
}

function updateQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  saveCart();
}

function clearCart() {
  cart = {};
  saveCart();
  closeDrawer();
}

function fmtPrice(p) {
  if (p === null || p === undefined) return 'Market Price';
  return 'NLE ' + p.toLocaleString();
}

function getCartTotal() {
  return Object.values(cart).reduce((s, i) => s + (i.price || 0) * i.qty, 0);
}

function getCartCount() {
  return Object.values(cart).reduce((s, i) => s + i.qty, 0);
}

// ── Render ──
function countItems(cat) {
  let c = (cat.items || []).length;
  if (cat.subs) cat.subs.forEach(s => c += s.items.length);
  return c;
}

function renderItem(item) {
  const qty = cart[item.id]?.qty || 0;
  const tags = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const desc = item.desc ? `<div class="item-desc">${item.desc}</div>` : '';
  const variants = item.variants ? `<div class="item-variants"><span>${item.variants}</span></div>` : '';
  const btn = qty === 0
    ? `<button class="add-btn" onclick="addToCart('${item.id}',\`${item.name.replace(/`/g,"'")}\`,${item.price})">+</button>`
    : `<div class="qty-controls">
        <button class="qty-btn" onclick="updateQty('${item.id}',-1)">−</button>
        <span class="qty-count">${qty}</span>
        <button class="qty-btn plus" onclick="updateQty('${item.id}',1)">+</button>
      </div>`;
  return `<div class="item"><div class="item-info"><div class="item-name">${item.name} ${tags}</div>${desc}${variants}<div class="item-price">${fmtPrice(item.price)}</div></div>${btn}</div>`;
}

function renderMenu(query) {
  const q = (query || '').toLowerCase();
  const content = document.getElementById('menuContent');
  let html = '';

  menu.forEach((cat, idx) => {
    let allItems = [...(cat.items || [])];
    let subsHtml = '';
    if (cat.subs) {
      cat.subs.forEach(sub => {
        const filtered = q ? sub.items.filter(i => i.name.toLowerCase().includes(q) || (i.desc||'').toLowerCase().includes(q)) : sub.items;
        if (filtered.length) {
          subsHtml += `<div class="sub-title">${sub.name}</div>` + filtered.map(renderItem).join('');
        }
      });
    }
    const filteredItems = q ? allItems.filter(i => i.name.toLowerCase().includes(q) || (i.desc||'').toLowerCase().includes(q)) : allItems;
    if (q && !filteredItems.length && !subsHtml) return;

    const isOpen = q ? true : false;
    const count = q ? filteredItems.length + (subsHtml ? '…' : 0) : countItems(cat);
    html += `<div class="section" id="section-${cat.id}" data-category-id="${cat.id}">
      <div class="section-header" onclick="toggleSection(this)">
        <div><h2>${cat.name}</h2><div class="count">${typeof count === 'number' ? count + ' items' : 'results'}</div></div>
        <svg class="chevron${isOpen?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 9l-7 7-7-7"/></svg>
      </div>
      <div class="section-body${isOpen?' open':''}">
        ${filteredItems.map(renderItem).join('')}
        ${subsHtml}
      </div>
    </div>`;
  });
  content.innerHTML = html;
}

function renderNav() {
  const nav = document.getElementById('catNav');
  nav.innerHTML = menu.map((cat, i) =>
    `<button class="cat-pill${i===0?' active':''}" data-id="${cat.id}" onclick="scrollToCat('${cat.id}')">${cat.name}<span>${countItems(cat)}</span></button>`
  ).join('');
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.chevron');
  body.classList.toggle('open');
  chevron.classList.toggle('open');
}

function scrollToCat(id) {
  const el = document.getElementById('section-' + id);
  if (el) {
    const top = el.getBoundingClientRect().top + window.scrollY - 120;
    window.scrollTo({ top, behavior: 'smooth' });
  }
}

// Active pill tracking
function setupObserver() {
  const observer = new IntersectionObserver(entries => {
    entries.filter(e => e.isIntersecting).sort((a,b) => a.boundingClientRect.top - b.boundingClientRect.top).forEach(e => {
      const id = e.target.getAttribute('data-category-id');
      if (id) {
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
        const activeBtn = document.querySelector(`.cat-pill[data-id="${id}"]`);
        if (activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
      }
    });
  }, { rootMargin: '-120px 0px -60% 0px' });
  document.querySelectorAll('.section').forEach(s => observer.observe(s));
}

// ── Cart UI ──
function updateCartUI() {
  const count = getCartCount();
  const total = getCartTotal();
  document.getElementById('cartBarBtn').classList.toggle('show', count > 0);
  document.getElementById('cartBadge').textContent = count;
  document.getElementById('cartTotal').textContent = fmtPrice(total);
  document.getElementById('drawerTotal').textContent = fmtPrice(total);

  // Re-render item buttons
  document.querySelectorAll('.section-body').forEach(() => {});
  renderMenu(document.getElementById('searchInput').value);
  setupObserver();

  // Drawer items
  const body = document.getElementById('drawerBody');
  const items = Object.entries(cart);
  if (!items.length) { body.innerHTML = '<div class="empty-msg">Your order is empty</div>'; return; }
  body.innerHTML = items.map(([id, item]) =>
    `<div class="drawer-item">
      <div><div class="drawer-item-name">${item.name}</div><div class="drawer-item-price">${fmtPrice(item.price * item.qty)}</div></div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="updateQty('${id}',-1)">−</button>
        <span class="qty-count">${item.qty}</span>
        <button class="qty-btn plus" onclick="updateQty('${id}',1)">+</button>
      </div>
    </div>`
  ).join('');
}

// ── Drawer ──
function openDrawer() {
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

// ── Payment ──
function openPay() {
  closeDrawer();
  document.getElementById('payFrame').src = 'https://pay.flotme.ai/';
  document.getElementById('payModal').classList.add('show');
}
function closePay() {
  document.getElementById('payModal').classList.remove('show');
  document.getElementById('payFrame').src = 'about:blank';
}

// ── Search ──
document.getElementById('searchInput').addEventListener('input', function() {
  renderMenu(this.value);
  setupObserver();
});

// ── Init ──
renderNav();
renderMenu('');
setupObserver();
updateCartUI();
</script>
